<script>
const terminal = document.getElementById("terminal");
const overlay = document.getElementById("overlay");
const curriculo = document.getElementById("curriculo");

/* ===== 1. Terminal de entrada ===== */
const linhas = [
    "Iniciando sistema...",
    "Conectando ao servidor...",
    "Verificando credenciais...",
    "Acesso detectado",
    "Carregando dados...",
    "Liberando acesso..."
].map(l => Array.from(l)); // separa por caractere "de verdade" (o emoji não quebra)

let linhaAtual = 0;
let letraAtual = 0;

function digitar() {
    if (linhaAtual < linhas.length) {
        if (letraAtual < linhas[linhaAtual].length) {
            terminal.textContent += linhas[linhaAtual][letraAtual];
            letraAtual++;
            setTimeout(digitar, 40);
        } else {
            terminal.textContent += "\n";
            linhaAtual++;
            letraAtual = 0;
            setTimeout(digitar, 500);
        }
    } else {
        setTimeout(() => {
            terminal.textContent += "\nACESSO LIBERADO";
            setTimeout(mostrarCurriculo, 1200);
        }, 500);
    }
}

function mostrarCurriculo() {
    overlay.style.display = "none";
    curriculo.style.display = "block";
    curriculo.classList.add("entrada");
}

digitar();

/* ===== 2. Seções clicáveis ===== */
function digitarTexto(conteudo, aoCrescer) {
    const linhasTexto = conteudo.dataset.texto.split("\n").map(l => l.trim());

    // remove linhas vazias do começo e do fim
    while (linhasTexto.length && linhasTexto[0] === "") linhasTexto.shift();
    while (linhasTexto.length && linhasTexto[linhasTexto.length - 1] === "") linhasTexto.pop();

    let i = 0;

    function proximaLinha() {
        if (i >= linhasTexto.length) return;

        const texto = linhasTexto[i++];
        const div = document.createElement("div");
        conteudo.appendChild(div);

        if (texto === "") {                // linha vazia = espaço entre blocos
            div.className = "espaco";
            aoCrescer();
            setTimeout(proximaLinha, 50);
            return;
        }

        div.className = "linha";
        const letras = Array.from(texto);
        let j = 0;

        function proximaLetra() {
            if (j < letras.length) {
                div.textContent += letras[j++];
                aoCrescer();
                setTimeout(proximaLetra, 10);
            } else {
                setTimeout(proximaLinha, 120);
            }
        }

        proximaLetra();
    }

    proximaLinha();
}

document.querySelectorAll(".secao").forEach(secao => {
    const conteudo = secao.nextElementSibling;
    let jaDigitado = false; // só digita na primeira vez que abrir

    // permite usar o teclado (Tab + Enter/Espaço)
    secao.setAttribute("tabindex", "0");
    secao.setAttribute("role", "button");
    secao.setAttribute("aria-expanded", "false");

    // ajusta a altura ao tamanho do texto (evita cortar textos longos)
    function ajustarAltura() {
        if (secao.classList.contains("ativo")) {
            conteudo.style.maxHeight = conteudo.scrollHeight + "px";
        }
    }

    function alternar() {
        const abrindo = !secao.classList.contains("ativo");

        secao.classList.toggle("ativo", abrindo);
        conteudo.classList.toggle("ativo", abrindo);
        secao.setAttribute("aria-expanded", abrindo);

        if (!abrindo) {
            conteudo.style.maxHeight = "0px";
            return;
        }

        if (!jaDigitado) {
            jaDigitado = true;
            digitarTexto(conteudo, ajustarAltura);
        }
        ajustarAltura();
    }

    secao.addEventListener("click", alternar);

    secao.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            alternar();
        }
    });
});
</script>
